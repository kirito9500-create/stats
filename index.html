<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дашборд Подземелья</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #e94560; text-align: center; font-size: 24px; }
        
        .setup-panel {
            background: #0f3460;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #435585;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        label { font-size: 12px; color: #a0aab2; text-transform: uppercase; font-weight: bold; }
        
        .date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            width: 100%;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        
        #startBtn { background-color: #e94560; grid-column: 1 / -1; }
        #startBtn:hover { background-color: #d83a56; }
        
        #stopBtn { background-color: #f44336; }
        #stopBtn:hover { background-color: #d32f2f; }
        
        #downloadBtn { background-color: #4CAF50; }
        #downloadBtn:hover { background-color: #388E3C; }
        
        button:disabled { background-color: #555 !important; cursor: not-allowed; color: #888; }
        
        #progressInfo {
            text-align: center;
            color: #4CAF50;
            font-weight: bold;
            margin: 15px 0;
            font-size: 14px;
            min-height: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: #1a1a2e;
            border: 1px solid #e94560;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        
        .stat-icon { font-size: 30px; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #fff; margin: 5px 0; }
        .stat-title { font-size: 12px; color: #a0aab2; text-transform: uppercase; }
        
        .card-gold { border-color: #ffd700; }
        .card-gold .stat-value { color: #ffd700; }
        .card-elite { border-color: #9c27b0; }
        .card-elite .stat-value { color: #e1bee7; }
        .card-arena { border-color: #ff5722; }
        .card-arena .stat-value { color: #ffab91; }
        .card-hunters { border-color: #4caf50; }
        .card-hunters .stat-value { color: #a5d6a7; }
        
    </style>
</head>
<body>

<div class="container">
    <h2>Трекер Подземелья</h2>
    
    <div class="setup-panel">
        <label>Токен ВК</label>
        <input type="text" id="tokenInput" placeholder="Токен ВКонтакте">
        
        <label>ID диалога с ботом</label>
        <input type="text" id="dialogIdInput" placeholder="-208825850">
        
        <div class="date-grid">
            <div>
                <label>С (Начало периода):</label>
                <input type="datetime-local" id="timeStartInput">
            </div>
            <div>
                <label>По (Конец периода):</label>
                <input type="datetime-local" id="timeEndInput">
            </div>
        </div>
        
        <button id="startBtn" onclick="startParsing()">Собрать статистику</button>
        
        <div class="buttons-grid">
            <button id="stopBtn" onclick="stopParsing()" disabled>⏹ Остановить</button>
            <button id="downloadBtn" onclick="downloadStats()" disabled>⬇️ Скачать отчет</button>
        </div>
    </div>

    <div id="progressInfo">Ожидание запуска...</div>

    <div class="stats-grid">
        <div class="stat-card card-gold">
            <div class="stat-icon">💰</div>
            <div class="stat-value" id="valGold">0</div>
            <div class="stat-title">Всего золота</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon">💀</div>
            <div class="stat-value" id="valTrophies">0</div>
            <div class="stat-title">Трофеев</div>
        </div>
        
        <div class="stat-card card-elite">
            <div class="stat-icon">☠️</div>
            <div class="stat-value" id="valElite">0</div>
            <div class="stat-title">Элита (Подземелье)</div>
        </div>

        <div class="stat-card card-arena">
            <div class="stat-icon">⚔️</div>
            <div class="stat-value" id="valArenaElites">0</div>
            <div class="stat-title">Элита (Арена)</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon">🛡️</div>
            <div class="stat-value" id="valRep">0</div>
            <div class="stat-title">Репутация Ордена</div>
        </div>

        <div class="stat-card card-hunters">
            <div class="stat-icon">🏹</div>
            <div class="stat-value" id="valHunterRep">0</div>
            <div class="stat-title">Репутация Охотников</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon">🏺</div>
            <div class="stat-value" id="valPots">0</div>
            <div class="stat-title">Горшочков найдено</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon">🏆</div>
            <div class="stat-value" id="valBattles">0</div>
            <div class="stat-title">Побед (Боев)</div>
        </div>
    </div>
</div>

<script>
    let stats = {
        gold: 0, trophies: 0, eliteTrophies: 0, arenaElites: 0, 
        reputation: 0, hunterRep: 0, pots: 0, battles: 0
    };

    let token = '';
    let dialogId = '';
    let startTimestamp = 0; 
    let endTimestamp = 0; 
    let currentOffset = 0;
    
    let isParsing = false;
    let isCancelled = false; // Флаг для остановки
    let messagesBuffer = [];

    // Форматирование даты для подстановки в input
    function getLocalISOTime(date) {
        const tzOffset = date.getTimezoneOffset() * 60000;
        return (new Date(date - tzOffset)).toISOString().slice(0,16);
    }

    window.onload = () => {
        const savedToken = localStorage.getItem('vk_token');
        const savedDialog = localStorage.getItem('vk_dialog_id');
        if (savedToken && savedDialog) {
            document.getElementById('tokenInput').value = savedToken;
            document.getElementById('dialogIdInput').value = savedDialog;
        }

        const now = new Date();
        
        // По умолчанию: Конец - текущее время
        document.getElementById('timeEndInput').value = getLocalISOTime(now);
        
        // По умолчанию: Начало - сегодня 00:00
        const startOfDay = new Date();
        startOfDay.setHours(0, 0, 0, 0);
        document.getElementById('timeStartInput').value = getLocalISOTime(startOfDay);
    };

    function resetStats() {
        stats = { gold: 0, trophies: 0, eliteTrophies: 0, arenaElites: 0, reputation: 0, hunterRep: 0, pots: 0, battles: 0 };
        messagesBuffer = [];
        updateUI();
    }

    function updateUI() {
        document.getElementById('valGold').innerText = stats.gold;
        document.getElementById('valTrophies').innerText = stats.trophies;
        document.getElementById('valElite').innerText = stats.eliteTrophies;
        document.getElementById('valArenaElites').innerText = stats.arenaElites;
        document.getElementById('valRep').innerText = stats.reputation;
        document.getElementById('valHunterRep').innerText = stats.hunterRep;
        document.getElementById('valPots').innerText = stats.pots;
        document.getElementById('valBattles').innerText = stats.battles;
    }

    function startParsing() {
        token = document.getElementById('tokenInput').value.trim();
        dialogId = document.getElementById('dialogIdInput').value.trim();
        const timeStart = document.getElementById('timeStartInput').value;
        const timeEnd = document.getElementById('timeEndInput').value;

        if (!token || !dialogId || !timeStart || !timeEnd) {
            alert('Заполните все поля, включая обе даты!');
            return;
        }

        localStorage.setItem('vk_token', token);
        localStorage.setItem('vk_dialog_id', dialogId);

        startTimestamp = Math.floor(new Date(timeStart).getTime() / 1000);
        endTimestamp = Math.floor(new Date(timeEnd).getTime() / 1000);

        if (startTimestamp > endTimestamp) {
            alert('Дата НАЧАЛА не может быть позже даты КОНЦА!');
            return;
        }
        
        resetStats();
        currentOffset = 0;
        isParsing = true;
        isCancelled = false;
        
        // Управление интерфейсом кнопок
        document.getElementById('startBtn').disabled = true;
        document.getElementById('downloadBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        
        document.getElementById('progressInfo').innerText = "Поиск сообщений в заданном диапазоне...";
        document.getElementById('progressInfo').style.color = "#4CAF50";

        fetchBatch();
    }

    // Экстренная остановка
    function stopParsing() {
        if (!isParsing) return;
        isCancelled = true;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('progressInfo').innerText = "Остановка... Обрабатываем то, что успели скачать.";
        document.getElementById('progressInfo').style.color = "#ff9800";
    }

    function fetchBatch() {
        if (!isParsing) return;

        // Если пользователь нажал "Остановить"
        if (isCancelled) {
            isParsing = false;
            setTimeout(processChronologically, 100);
            return;
        }

        const script = document.createElement('script');
        const callbackName = 'vkParse_' + Math.round(Math.random() * 1000000);
        
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.head.removeChild(script);

            if (data.error) {
                document.getElementById('progressInfo').innerText = "Ошибка ВК: " + data.error.error_msg;
                document.getElementById('progressInfo').style.color = "#f44336";
                finalizeParsingUI();
                return;
            }

            if (data.response && data.response.items) {
                const items = data.response.items;
                let reachedOldLimit = false;

                for (let msg of items) {
                    // 1. Если сообщение старее, чем дата "С" -> мы закончили сбор
                    if (msg.date < startTimestamp) {
                        reachedOldLimit = true;
                        break; 
                    }
                    
                    // 2. Если сообщение новее, чем дата "ПО" -> пропускаем его, идем дальше
                    if (msg.date > endTimestamp) {
                        continue;
                    }

                    // 3. Сообщение попадает в наш диапазон, сохраняем в буфер
                    if (msg.out === 0 && msg.text) {
                        messagesBuffer.push(msg.text);
                    }
                }

                if (reachedOldLimit || items.length === 0) {
                    isParsing = false;
                    document.getElementById('progressInfo').innerText = "Анализ данных...";
                    setTimeout(processChronologically, 100);
                } else {
                    currentOffset += 200;
                    document.getElementById('progressInfo').innerText = `Проверено ${currentOffset} сообщений... Найдено: ${messagesBuffer.length}`;
                    setTimeout(fetchBatch, 350); 
                }
            }
        };

        script.onerror = function() {
            delete window[callbackName];
            document.head.removeChild(script);
            document.getElementById('progressInfo').innerText = "Ошибка сети! Пробую снова...";
            setTimeout(fetchBatch, 1000);
        };

        script.src = `https://api.vk.com/method/messages.getHistory?peer_id=${dialogId}&count=200&offset=${currentOffset}&v=5.131&access_token=${token}&callback=${callbackName}`;
        document.head.appendChild(script);
    }

    function processChronologically() {
        messagesBuffer.reverse();
        let inArena = false;

        for (let text of messagesBuffer) {
            if (/Элитная арена/i.test(text) && /развлечений/i.test(text)) inArena = true;
            if (/не смогли одолеть очередного противника/i.test(text) || /прогоняет Вас с арены/i.test(text)) inArena = false;

            const goldMatch = text.match(/(?:за|на|заработали)\s+(\d+)\s+золота/i);
            if (goldMatch) stats.gold += parseInt(goldMatch[1]);

            const potMatch = text.match(/горшок с золотом\s*\((\d+)\)/i);
            if (potMatch) {
                stats.pots += 1;
                stats.gold += parseInt(potMatch[1]);
            }

            const trophyMatch1 = text.match(/Вы получили\s+(\d+)\s+трофеев/i);
            const trophyMatch2 = text.match(/Трофеи\s*\+\s*(\d+)/i);
            const trophyHunterMatch = text.match(/Получено трофеев и репутации:\s*(\d+)/i);
            
            if (trophyMatch1) stats.trophies += parseInt(trophyMatch1[1]);
            if (trophyMatch2) stats.trophies += parseInt(trophyMatch2[1]);
            if (trophyHunterMatch) {
                const val = parseInt(trophyHunterMatch[1]);
                stats.trophies += val;
                stats.hunterRep += val;
            }

            const hunterRepExchange = text.match(/обменяли.*на\s*(\d+)\s*репутации/i);
            if (hunterRepExchange) stats.hunterRep += parseInt(hunterRepExchange[1]);

            if (/Элитный трофей/i.test(text)) {
                if (inArena) stats.arenaElites += 1;
                else stats.eliteTrophies += 1;
            }

            const repMatch = text.match(/Заработано репутации Ордена:\s*(\d+)/i);
            if (repMatch) {
                stats.battles += 1;
                stats.reputation += parseInt(repMatch[1]);
            }
        }

        updateUI();
        
        if (isCancelled) {
            document.getElementById('progressInfo').innerText = `Сбор ПРЕРВАН! Обработано ${messagesBuffer.length} сообщений.`;
        } else {
            document.getElementById('progressInfo').innerText = `Готово! Успешно обработано ${messagesBuffer.length} сообщений.`;
        }
        document.getElementById('progressInfo').style.color = "#ffd700";
        
        finalizeParsingUI();
        messagesBuffer = [];
    }

    // Возвращает кнопки в исходное состояние и включает кнопку скачивания
    function finalizeParsingUI() {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('downloadBtn').disabled = false;
    }

    // Генерация и скачивание текстового отчета
    function downloadStats() {
        const timeStart = new Date(startTimestamp * 1000).toLocaleString('ru-RU');
        const timeEnd = new Date(endTimestamp * 1000).toLocaleString('ru-RU');
        
        const reportContent = 
`=== ОТЧЕТ: ТРЕКЕР ПОДЗЕМЕЛЬЯ ===
Период сбора: ${timeStart} - ${timeEnd}
Статус сбора: ${isCancelled ? "ПРЕРВАН ПОЛЬЗОВАТЕЛЕМ (Частичные данные)" : "ПОЛНЫЙ"}

💰 ЭКОНОМИКА
- Всего найдено/заработано золота: ${stats.gold}
- Найдено горшочков с золотом: ${stats.pots}

💀 ДОБЫЧА И ТРОФЕИ
- Обычные трофеи: ${stats.trophies}
- Элитные трофеи (Подземелье): ${stats.eliteTrophies}
- Элитные трофеи (Арена): ${stats.arenaElites}

🛡 РЕПУТАЦИЯ И БОИ
- Проведено победных боев: ${stats.battles}
- Получено репутации Ордена: ${stats.reputation}
- Получено репутации Охотников: ${stats.hunterRep}

Сгенерировано автоматически из истории ВК.
`;
        
        // Создаем виртуальный файл (Blob)
        const blob = new Blob([reportContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        
        // Создаем скрытую ссылку и "кликаем" по ней
        const a = document.createElement('a');
        a.href = url;
        // Называем файл с указанием текущей даты, чтобы они не перезаписывались в папке загрузок
        const fileDate = new Date().toISOString().slice(0,10);
        a.download = `dungeon_report_${fileDate}.txt`;
        document.body.appendChild(a);
        a.click();
        
        // Убираем мусор
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
